[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot"
version = "0.1.0"
description = "Explainable, guardrailed tokenized-stock agent for Base (Agentic Stock Finance prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
stockpilot = "stockpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
